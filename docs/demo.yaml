filename: user
package: system

CreateThreshold: 
  method: POST
  path: /thresholds
  filename: threshold
  req:
    name: string
    score: string
  res:
    id: int64
UpdateThreshold:
  method: PUT
  path: /thresholds/:id(int64)
  req:
    name: string
  res:
    updated: bool

GetCharacterSkills:
  method: GET
  path: /characters/:id(int64)/skills
  res:
    list:
      - id: int64
        name: string
        level: [int] 