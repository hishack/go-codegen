# go-codegen 配置文件
# 所有相对路径都相对于本配置文件所在目录解析(与执行 gen 时的工作目录无关)

# 输入:yaml 目录(每个文件一个领域模块)
yaml: ./yamlPath

# 目标工程 go module 名,生成 import 路径时使用
module: codegen-example

# 输出:目标工程的各层目录
serviceOut: ./example/internal/service
modelOut:   ./example/internal/model/gen   # 其下自动分 request/ response/ 子包
logicOut:   ./example/internal/logic
handlerOut: ./example/internal/handler
routerOut:  ./example/internal/router

# 输出:前端 ts api 目录(留空则跳过前端生成)
webOut: ./example/web/src/api

# 写入生成文件头的署名
author: shack
github: https://github.com/hishack

# 路由分组前缀(可选):生成路由、swagger、前端 url 时统一加上
group: /api/v1
