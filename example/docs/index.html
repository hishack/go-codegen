<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>go-codegen 示例接口文档</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css">
  <style>
    body { margin: 0; background: #fafafa; }
    .topbar { padding: 12px 20px; background: #1b1b1f; color: #fff; font: 14px/1.6 system-ui, sans-serif; }
    .topbar code { background: #333; padding: 2px 6px; border-radius: 3px; }
  </style>
</head>
<body>
  <div class="topbar">
    接口规范: <code>/swagger/swagger.json</code> &nbsp;|&nbsp;
    运行时路由: <code>/routes</code> &nbsp;|&nbsp;
    路由冲突: <code>/conflicts</code>
  </div>
  <div id="swagger-ui"></div>
  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
  <script>
    window.onload = function () {
      window.ui = SwaggerUIBundle({
        url: "./swagger.json",
        dom_id: "#swagger-ui",
        deepLinking: true,
        presets: [SwaggerUIBundle.presets.apis],
        layout: "BaseLayout"
      });
    };
  </script>
</body>
</html>
