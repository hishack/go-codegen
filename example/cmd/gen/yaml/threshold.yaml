filename: threshold
package: system

# 新增阈值
CreateThreshold:
  method: POST
  path: /thresholds
  filename: threshold
  req:
    name: string # 阈值名称
    score: string # 阈值档位,如 easy/normal/hard
  res:
    id: int64 # 阈值主键

# 更新阈值
UpdateThreshold:
  method: PUT
  path: /thresholds/:id(int64)
  filename: threshold
  req:
    name: string # 新的阈值名称
  res:
    updated: bool # 是否更新成功

# 查询角色技能列表
GetCharacterSkills:
  method: GET
  path: /characters/:id(int64)/skills
  filename: character
  res:
    list:
      - id: int64 # 技能 id
        name: string # 技能名称
        level: [int] # 已解锁的等级列表
