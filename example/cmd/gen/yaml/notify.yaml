filename: notify
package: system

# 发送短信验证码
SendSmsCode:
  method: POST
  path: /notify/sms
  req:
    phone: string # 手机号
    scene: string # 场景,如 login/register
  res:
    expireIn: int # 验证码有效期,单位秒

# 查询通知列表
ListNotifies:
  method: GET
  path: /notifies
  req:
    userId: int64 # 按用户过滤
    read: bool # 是否已读
  res:
    total: int64 # 总条数
    list:
      - id: int64 # 通知 id
        title: string # 通知标题
        content: string # 通知内容
        read: bool # 是否已读
        createAt: time.Time # 通知时间

# 标记通知已读
ReadNotify:
  method: PATCH
  path: /notifies/:id(int64)/read
  res:
    read: bool # 是否标记成功

# 扩展属性示例:map 类型
GetNotifyConfig:
  method: GET
  path: /notifies/config
  res:
    channels: [string] # 开启的通知渠道
    extras: map[string]string # 渠道对应的扩展配置
